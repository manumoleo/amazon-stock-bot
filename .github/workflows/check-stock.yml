name: Comprobar disponibilidad

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Enviar un mensaje de prueba a Telegram"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: amazon-stock-check
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar productos y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python3 check_stock.py

      - name: Guardar el estado si ha cambiado
        run: |
          if git diff --quiet -- .stock-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stock-state.json
          git commit -m "chore: actualizar estado de disponibilidad"
          git push
